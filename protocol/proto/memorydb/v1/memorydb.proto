
syntax = "proto3";

package memorydb.v1;

option go_package = "github.com/pescador95/memorydb/protocol/generated/go/memorydb/v1;memorydbpb";

option java_package = "io.github.pescador95.memorydb.v1";
option java_multiple_files = true;
option java_outer_classname = "MemorydbProto";



message Request {
    uint64 request_id = 1;

    oneof command {
        PingCommand ping = 2;
        SetCommand set = 3;
        GetCommand get = 4;
        DeleteCommand delete = 5;
    }
}

message Response {
    uint64 request_id = 1;
    bool success = 2;

    oneof result {
        PongResult pong = 3;
        SetResult set = 4;
        GetResult get = 5;
        DeleteResult delete = 6;
        ErrorResult error = 7;
    }
}

message PingCommand {}

message PongResult {}

message SetCommand {
    string key = 1;
    bytes value = 2;
    uint64 ttl_ms = 3;
}

message SetResult {}

message GetCommand {
    string key = 1;
}

message GetResult {
    bool found = 1;
    bytes value = 2;
}

message DeleteCommand {
    string key = 1;
}

message DeleteResult {
    bool deleted = 1;
}

message ErrorResult {
    string code = 1;
    string message = 2;
}
