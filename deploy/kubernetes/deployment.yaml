apiVersion: apps/v1
kind: Deployment
metadata:
  name: memorydb
  labels:
    app.kubernetes.io/name: memorydb
    app.kubernetes.io/component: database
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: memorydb

  template:
    metadata:
      labels:
        app.kubernetes.io/name: memorydb
        app.kubernetes.io/component: database

    spec:
      automountServiceAccountToken: false

      terminationGracePeriodSeconds: 20

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: memorydb
          image: memorydb:local
          imagePullPolicy: IfNotPresent

          ports:
            - name: tcp
              containerPort: 6380
              protocol: TCP

            - name: health
              containerPort: 8081
              protocol: TCP

          envFrom:
            - configMapRef:
                name: memorydb-config

          startupProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          resources:
            requests:
              cpu: "2500m"
              memory: "2Gi"
            limits:
              cpu: "2500m"
              memory: "2Gi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
