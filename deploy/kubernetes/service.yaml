apiVersion: v1
kind: Service
metadata:
  name: memorydb
  labels:
    app.kubernetes.io/name: memorydb
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: memorydb

  ports:
    - name: tcp
      port: 6380
      targetPort: tcp
      protocol: TCP

    - name: health
      port: 8081
      targetPort: health
      protocol: TCP
